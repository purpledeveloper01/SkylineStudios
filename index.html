<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Skyline Studios is now SoggyToast</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://soggytoast.xyz/" />
  <link rel="icon" href="https://soggytoast.xyz/assets/favicon.svg" type="image/svg+xml" />
  <!-- Works even with JavaScript off -->
  <meta http-equiv="refresh" content="4; url=https://soggytoast.xyz/" />
  <style>
    @font-face {
      font-family: "Fredoka";
      src: url("https://soggytoast.xyz/assets/fonts/Fredoka.ttf") format("truetype");
      font-weight: 300 700;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 40%, #161616 0%, #000 70%);
      color: #fff;
      font-family: "Fredoka", system-ui, sans-serif;
      text-align: center;
      overflow: hidden;
    }
    .wrap { animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .logo { width: 112px; height: 112px; margin: 0 auto 28px; animation: bob 3s ease-in-out infinite; }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 60px); font-weight: 700; line-height: 1.1; }
    .accent { color: #5200ff; }
    p { margin: 16px 0 0; font-size: 18px; color: #a3a3a3; }
    .bar { width: 220px; height: 4px; margin: 32px auto 0; border-radius: 4px; background: #262626; overflow: hidden; }
    .bar span { display: block; height: 100%; width: 0; background: #5200ff; animation: fill 4s linear forwards; }
    a {
      display: inline-block;
      margin-top: 28px;
      padding: 13px 30px;
      border: 2px solid #fff;
      border-radius: 999px;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.3s, color 0.3s;
    }
    a:hover { background: #fff; color: #000; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    @keyframes fill { to { width: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      .wrap, .logo { animation: none; }
      .bar span { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="https://soggytoast.xyz/assets/logo.svg" alt="SoggyToast logo" />
    <h1>Skyline Studios is now <span class="accent">SoggyToast</span></h1>
    <p>Same team, new name. Taking you there now…</p>
    <div class="bar" aria-hidden="true"><span></span></div>
    <a href="https://soggytoast.xyz/">Go now</a>
  </main>
  <script>
    setTimeout(() => location.replace("https://soggytoast.xyz/"), 4000);
  </script>
</body>
</html>
